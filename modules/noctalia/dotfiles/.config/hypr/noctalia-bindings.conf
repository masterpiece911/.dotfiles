# Noctalia integration for the hypr dotfiles module.
$menu = noctalia msg panel-toggle launcher
$lock = noctalia msg session lock
exec-once = noctalia

bindd = $mod, D, Display controls, exec, noctalia msg panel-toggle control-center monitor
bindd = $mod, space, Launcher, exec, $menu
bindd = $mod, T, Hyprland tiling layouts, exec, noctalia msg plugin noyan/layout-picker:events all advance
bindd = $mod, W, Wi-Fi and network, exec, noctalia msg panel-toggle control-center network
bind = $mod CTRL, L, exec, $lock
bindr = $mod, Escape, exec, $lock
bindr = $mod, I, exec, noctalia msg bar-toggle

bindl = , XF86AudioMute, exec, noctalia msg volume-mute
bindl = , XF86AudioMicMute, exec, noctalia msg mic-mute
bindel = , XF86AudioLowerVolume, exec, noctalia msg volume-down 5
bindel = , XF86AudioRaiseVolume, exec, noctalia msg volume-up 5
bindel = , XF86MonBrightnessDown, exec, noctalia msg brightness-down
bindel = , XF86MonBrightnessUp, exec, noctalia msg brightness-up

# Framework F9 emits Super+P, like Windows' Project key.
bindd = $mod, P, Project display options, exec, noctalia msg panel-toggle noyan/projector:chooser
bindd = , XF86Display, Project display options, exec, noctalia msg panel-toggle noyan/projector:chooser
bind = $mod SHIFT, F3, exec, python3 ~/.local/share/noctalia/plugins/display-mover/mover.py

# Screenshots and annotation.
bindrd = , Print, Screen capture chooser, exec, python3 ~/.config/hypr/scripts/desktop-utilities.py capture-menu
bindr = , XF86AudioMedia, exec, noctalia msg screenshot-region
bindr = SHIFT, Print, exec, noctalia msg screenshot-fullscreen all
bindr = SHIFT ALT, Print, exec, noctalia msg screenshot-region
bindrd = CTRL, Print, Area screenshot to clipboard, exec, python3 ~/.config/hypr/scripts/desktop-utilities.py screenshot-copy

# Panels and everyday desktop utilities.
bindr = $mod SHIFT, E, exec, noctalia msg panel-toggle session
bindr = $mod SHIFT, P, exec, noctalia msg panel-toggle session
bind = $mod, A, exec, noctalia msg panel-toggle control-center audio
bind = $mod, V, exec, noctalia msg panel-toggle clipboard
bind = $mod, comma, exec, noctalia msg settings-toggle
bindd = $mod SHIFT, Return, Browser, exec, python3 ~/.config/hypr/scripts/desktop-utilities.py browser
bindd = $mod, C, Settings, exec, noctalia msg settings-toggle
bindd = $mod, B, Bluetooth, exec, noctalia msg panel-toggle control-center bluetooth
bindrd = ALT SHIFT, space, Dismiss active notifications, exec, noctalia msg notification-clear-active
bindd = $mod, N, Notification history, exec, noctalia msg panel-toggle control-center notifications
bindd = $mod SHIFT, R, Refresh shell settings, exec, noctalia msg config-reload
bindrd = $mod SHIFT, S, Lock and suspend, exec, noctalia msg session lock-and-suspend
bindrd = $mod SHIFT, B, Reboot with confirmation, exec, python3 ~/.config/hypr/scripts/desktop-utilities.py reboot
bindd = $mod, F1, Shortcut reference, exec, python3 ~/.config/hypr/scripts/desktop-utilities.py shortcuts
bindd = $mod SHIFT, slash, Shortcut reference, exec, python3 ~/.config/hypr/scripts/desktop-utilities.py shortcuts

# Generated colors stay local, not in Git (see the module installer).
source = ~/.config/hypr/noctalia.conf
# Non-consuming companion bindings for the Framework media row.
source = ~/.config/hypr/media-key-guide.conf
