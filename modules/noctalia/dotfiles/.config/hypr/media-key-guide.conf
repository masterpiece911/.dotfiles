# Passive companion binds: keep normal media actions in hyprland.conf unchanged.
# n = non-consuming; e = repeat (refresh the hide timer while adjusting a level).
# Deliberately no l flag: the guide must not open over the lock screen.
bindn = , XF86AudioMute, exec, noctalia msg plugin noyan/media-key-guide:events all show 1
binden = , XF86AudioLowerVolume, exec, noctalia msg plugin noyan/media-key-guide:events all show 2
binden = , XF86AudioRaiseVolume, exec, noctalia msg plugin noyan/media-key-guide:events all show 3
bindn = , XF86AudioPrev, exec, noctalia msg plugin noyan/media-key-guide:events all show 4
bindn = , XF86AudioPlay, exec, noctalia msg plugin noyan/media-key-guide:events all show 5
bindn = , XF86AudioPause, exec, noctalia msg plugin noyan/media-key-guide:events all show 5
bindn = , XF86AudioNext, exec, noctalia msg plugin noyan/media-key-guide:events all show 6
binden = , XF86MonBrightnessDown, exec, noctalia msg plugin noyan/media-key-guide:events all show 7
binden = , XF86MonBrightnessUp, exec, noctalia msg plugin noyan/media-key-guide:events all show 8
# Framework's display key emits Super+P; some keyboards emit XF86Display instead.
bindn = SUPER, p, exec, noctalia msg plugin noyan/media-key-guide:events all show 9
bindn = , XF86Display, exec, noctalia msg plugin noyan/media-key-guide:events all show 9
bindn = , XF86RFKill, exec, noctalia msg plugin noyan/media-key-guide:events all show 10
bindn = , XF86WLAN, exec, noctalia msg plugin noyan/media-key-guide:events all show 10
bindn = , Print, exec, noctalia msg plugin noyan/media-key-guide:events all show 11
bindn = , XF86AudioMedia, exec, noctalia msg plugin noyan/media-key-guide:events all show 12
