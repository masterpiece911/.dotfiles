# Match the GNOME Terminal "Regolith" profile (Nord, Cascadia Code PL 12).

font_family      Cascadia Code PL
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

foreground #E5E9F0
background #2E3440
background_opacity 1.0

selection_foreground #2E3440
selection_background #D8DEE9

cursor            #D8DEE9
cursor_text_color #BF616A
cursor_shape      block
cursor_blink_interval 0

enable_audio_bell    no
visual_bell_duration 0.0
window_alert_on_bell no
bell_on_tab          no

# No client-side title bar, same as GNOME Terminal under Regolith/i3.
hide_window_decorations yes

scrollback_lines 10000
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

# Kitty-only extras. These have no GNOME Terminal equivalent.

# Trail behind the text cursor on jumps (word motions, clicks, search).
# Stays quiet for single-cell typing. Color is Nord frost.
cursor_trail 20
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_trail_color #88C0D0

# Hide the mouse pointer as soon as you type.
mouse_hide_wait -1

# Curly underline on URLs; hovering a real hyperlink shows its target.
url_color #88C0D0
url_style curly
underline_hyperlinks hover
show_hyperlink_targets always

# Powerline tabs, only once a second tab exists.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_activity_symbol ●
active_tab_foreground   #2E3440
active_tab_background   #88C0D0
active_tab_font_style   bold
inactive_tab_foreground #E5E9F0
inactive_tab_background #3B4252
inactive_tab_font_style normal

# Desktop notification when a command longer than 5s finishes in an unfocused window.
shell_integration enabled
notify_on_cmd_finish unfocused

# Nord palette from the Regolith profile.
color0  #2E3440
color1  #BF616A
color2  #A3BE8C
color3  #EBCB8B
color4  #5E81AC
color5  #B48EAD
color6  #88C0D0
color7  #E5E9F0
color8  #D8DEE9
color9  #BF616A
color10 #A3BE8C
color11 #EBCB8B
color12 #5E81AC
color13 #B48EAD
color14 #88C0D0
color15 #ECEFF4

# kitty-scrollback.nvim
# allow_remote_control and listen_on take effect only after a full Kitty restart.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-$USER

# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten /home/sahi_no/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

# Browse scrollback buffer in nvim
map kitty_mod+h kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# Moonlander
enabled_layouts splits,tall,fat,stack

# Focus (spatial) 
map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window bottom
map ctrl+alt+k neighboring_window top
map ctrl+alt+l neighboring_window right

# Tabs 
map ctrl+alt+comma  previous_tab
map ctrl+alt+period next_tab

# Splits / window 
map ctrl+alt+v launch --location=vsplit --cwd=current
map ctrl+alt+s launch --location=hsplit --cwd=current
map ctrl+alt+w close_window
map ctrl+alt+z toggle_layout stack

# Scroll 
map ctrl+alt+page_up   scroll_page_up
map ctrl+alt+page_down scroll_page_down
