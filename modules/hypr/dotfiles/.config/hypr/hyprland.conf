# Sway-derived configuration for Ubuntu's Hyprland 0.53.3 (hyprlang).
# Managed by the hypr dotfiles module; shell integrations live in noctalia.
$mod = SUPER
$term = kitty
monitor = , preferred, auto, 1
monitor = eDP-1, preferred, auto, 2

general {
    gaps_in = 4
    gaps_out = 16
    border_size = 2
    col.active_border = rgb(88c0d0) rgb(5e81ac) 45deg
    col.inactive_border = rgb(3b4252)
    layout = dwindle
    resize_on_border = true
}
# Nord flourishes: rounded glass, soft shadows, and animated transitions.
decoration {
    rounding = 10
    active_opacity = 0.97
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0
    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000055)
    }
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }
}
animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    bezier = gentle, 0.4, 0, 0.2, 1
    animation = windows, 1, 4, smooth, popin 85%
    animation = windowsOut, 1, 3, gentle, popin 85%
    animation = fade, 1, 3, gentle
    animation = border, 1, 4, gentle
    animation = borderangle, 1, 60, default, loop
    animation = workspaces, 1, 4, smooth, slide
    animation = specialWorkspace, 1, 4, smooth, slidevert
}
dwindle {
    preserve_split = true
}
input {
    kb_layout = us,de,tr
    follow_mouse = 0
    scroll_method = 2fg
    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap_button_map = lrm
        clickfinger_behavior = true
        disable_while_typing = true
    }
}
binds {
    workspace_back_and_forth = true
}

gesture = 3, horizontal, workspace

monitor = eDP-1, preferred, auto-left, 2

# German regional formats, English interface and messages.
env = LANG,de_DE.UTF-8
env = LC_MESSAGES,en_US.UTF-8
env = LANGUAGE,en_US:en

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP

bind = $mod, Return, exec, $term
bind = $mod SHIFT, Q, killactive,
bind = $mod SHIFT, C, exec, hyprctl reload
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bind = $mod, F, fullscreen, 0
# Familiar floating/tiled controls.
bind = $mod SHIFT, F, exec, python3 ~/.config/hypr/scripts/float-window.py
bind = $mod SHIFT, T, exec, python3 ~/.config/hypr/scripts/focus-window-type.py
bind = $mod SHIFT, space, exec, python3 ~/.config/hypr/scripts/float-window.py
# Split orientation toggle; explicit horizontal/vertical selects are unavailable.
bind = $mod, E, togglesplit,
# Groups are the closest built-in equivalent of Sway tabs.
bind = $mod, S, changegroupactive, f
# No equivalent for Sway's parent-container focus (Super+A).
bind = $mod SHIFT, minus, movetoworkspacesilent, special:scratchpad
bind = $mod, minus, togglespecialworkspace, scratchpad
bind = $mod, R, submap, resize
# Docked lid close disables internal outputs; lid open restores them.
bindl = , switch:on:Lid Switch, exec, python3 ~/.config/hypr/lid.py hypr close
bindl = , switch:off:Lid Switch, exec, python3 ~/.config/hypr/lid.py hypr open
bindr = $mod ALT, BackSpace, exec, hyprctl switchxkblayout all next
bindr = $mod ALT SHIFT, BackSpace, exec, hyprctl switchxkblayout all prev
bind = $mod, h, movefocus, l
bind = $mod SHIFT, h, movewindow, l
bind = $mod, j, movefocus, d
bind = $mod SHIFT, j, movewindow, d
bind = $mod, k, movefocus, u
bind = $mod SHIFT, k, movewindow, u
bind = $mod, l, movefocus, r
bind = $mod SHIFT, l, movewindow, r
bind = $mod, Left, movefocus, l
bind = $mod SHIFT, Left, movewindow, l
bind = $mod, Down, movefocus, d
bind = $mod SHIFT, Down, movewindow, d
bind = $mod, Up, movefocus, u
bind = $mod SHIFT, Up, movewindow, u
bind = $mod, Right, movefocus, r
bind = $mod SHIFT, Right, movewindow, r
bind = $mod, 1, workspace, 1
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod, 2, workspace, 2
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod, 3, workspace, 3
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod, 6, workspace, 6
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod, 7, workspace, 7
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod, 8, workspace, 8
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 0, movetoworkspacesilent, 10
# Workspaces 11-20: extend the 1-10 scheme with Ctrl.
bind = $mod CTRL, 1, workspace, 11
bind = $mod CTRL SHIFT, 1, movetoworkspacesilent, 11
bind = $mod CTRL, 2, workspace, 12
bind = $mod CTRL SHIFT, 2, movetoworkspacesilent, 12
bind = $mod CTRL, 3, workspace, 13
bind = $mod CTRL SHIFT, 3, movetoworkspacesilent, 13
bind = $mod CTRL, 4, workspace, 14
bind = $mod CTRL SHIFT, 4, movetoworkspacesilent, 14
bind = $mod CTRL, 5, workspace, 15
bind = $mod CTRL SHIFT, 5, movetoworkspacesilent, 15
bind = $mod CTRL, 6, workspace, 16
bind = $mod CTRL SHIFT, 6, movetoworkspacesilent, 16
bind = $mod CTRL, 7, workspace, 17
bind = $mod CTRL SHIFT, 7, movetoworkspacesilent, 17
bind = $mod CTRL, 8, workspace, 18
bind = $mod CTRL SHIFT, 8, movetoworkspacesilent, 18
bind = $mod CTRL, 9, workspace, 19
bind = $mod CTRL SHIFT, 9, movetoworkspacesilent, 19
bind = $mod CTRL, 0, workspace, 20
bind = $mod CTRL SHIFT, 0, movetoworkspacesilent, 20

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioStop, exec, playerctl stop

submap = resize
binde = , h, resizeactive, -10 0
binde = , j, resizeactive, 0 10
binde = , k, resizeactive, 0 -10
binde = , l, resizeactive, 10 0
binde = , Left, resizeactive, -10 0
binde = , Down, resizeactive, 0 10
binde = , Up, resizeactive, 0 -10
binde = , Right, resizeactive, 10 0
# Hold Shift for larger resize steps (40 versus the normal 10).
binde = SHIFT, h, resizeactive, -40 0
binde = SHIFT, j, resizeactive, 0 40
binde = SHIFT, k, resizeactive, 0 -40
binde = SHIFT, l, resizeactive, 40 0
binde = SHIFT, Left, resizeactive, -40 0
binde = SHIFT, Down, resizeactive, 0 40
binde = SHIFT, Up, resizeactive, 0 -40
binde = SHIFT, Right, resizeactive, 40 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset


# Float and center; Kitty uses a 100-column by 30-row grid.
bind = $mod CTRL SHIFT, F3, exec, python3 ~/.config/hypr/scripts/float-window.py --float

# Migrated everyday utilities and navigation.
bindd = $mod SHIFT, N, Files, exec, nautilus --new-window
bindd = $mod, period, Last focused window, focuscurrentorlast,
bindd = $mod, Tab, Next workspace, workspace, e+1
bindd = $mod SHIFT, Tab, Previous workspace, workspace, e-1
bindd = $mod ALT, Right, Next workspace, workspace, e+1
bindd = $mod ALT, Left, Previous workspace, workspace, e-1
bindd = $mod CTRL, Tab, Next workspace on this monitor, workspace, m+1
bindd = $mod CTRL SHIFT, Tab, Previous workspace on this monitor, workspace, m-1
bindd = $mod CTRL, J, Previous workspace on this monitor, workspace, m-1
bindd = $mod CTRL, A, Show scratchpad, togglespecialworkspace, scratchpad
bindd = $mod CTRL, M, Toggle window scratchpad, exec, if hyprctl activewindow -j | jq -e '.workspace.name == "special:scratchpad"' >/dev/null; then hyprctl dispatch movetoworkspacesilent +0; else hyprctl dispatch movetoworkspacesilent special:scratchpad; fi
bindd = $mod ALT SHIFT, U, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = $mod ALT, 1, Carry window to workspace 1, movetoworkspace, 1
bindd = $mod CTRL ALT, 1, Carry window to workspace 11, movetoworkspace, 11
bindd = $mod ALT, 2, Carry window to workspace 2, movetoworkspace, 2
bindd = $mod CTRL ALT, 2, Carry window to workspace 12, movetoworkspace, 12
bindd = $mod ALT, 3, Carry window to workspace 3, movetoworkspace, 3
bindd = $mod CTRL ALT, 3, Carry window to workspace 13, movetoworkspace, 13
bindd = $mod ALT, 4, Carry window to workspace 4, movetoworkspace, 4
bindd = $mod CTRL ALT, 4, Carry window to workspace 14, movetoworkspace, 14
bindd = $mod ALT, 5, Carry window to workspace 5, movetoworkspace, 5
bindd = $mod CTRL ALT, 5, Carry window to workspace 15, movetoworkspace, 15
bindd = $mod ALT, 6, Carry window to workspace 6, movetoworkspace, 6
bindd = $mod CTRL ALT, 6, Carry window to workspace 16, movetoworkspace, 16
bindd = $mod ALT, 7, Carry window to workspace 7, movetoworkspace, 7
bindd = $mod CTRL ALT, 7, Carry window to workspace 17, movetoworkspace, 17
bindd = $mod ALT, 8, Carry window to workspace 8, movetoworkspace, 8
bindd = $mod CTRL ALT, 8, Carry window to workspace 18, movetoworkspace, 18
bindd = $mod ALT, 9, Carry window to workspace 9, movetoworkspace, 9
bindd = $mod CTRL ALT, 9, Carry window to workspace 19, movetoworkspace, 19
bindd = $mod ALT, 0, Carry window to workspace 10, movetoworkspace, 10
bindd = $mod CTRL ALT, 0, Carry window to workspace 20, movetoworkspace, 20
bindd = $mod CTRL SHIFT, Left, Move workspace to l monitor, movecurrentworkspacetomonitor, l
bindd = $mod CTRL SHIFT, Down, Move workspace to d monitor, movecurrentworkspacetomonitor, d
bindd = $mod CTRL SHIFT, Up, Move workspace to u monitor, movecurrentworkspacetomonitor, u
bindd = $mod CTRL SHIFT, Right, Move workspace to r monitor, movecurrentworkspacetomonitor, r
bindd = $mod CTRL SHIFT, H, Move workspace to l monitor, movecurrentworkspacetomonitor, l
bindd = $mod CTRL SHIFT, J, Move workspace to d monitor, movecurrentworkspacetomonitor, d
bindd = $mod CTRL SHIFT, K, Move workspace to u monitor, movecurrentworkspacetomonitor, u
bindd = $mod CTRL SHIFT, L, Move workspace to r monitor, movecurrentworkspacetomonitor, r

# Shell integration, supplied by the noctalia dotfiles module.
source = ~/.config/hypr/noctalia-bindings.conf

# For Noctalia Color templates
source = ~/.config/hypr/noctalia.conf
